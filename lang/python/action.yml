name: 'Publish to PyPi'
description: |
  A subcomponent of pulumi-package-publish

inputs:
  version:
    description: >-
      The version of the provider being published.

      TODO: Validate that the SDK we are publishing matches this input.
    required: true
  pypiTrustedPublishing:
    description: Publish to PyPI using trusted publishing instead of PYPI_USERNAME/PYPI_PASSWORD.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Download python SDK
      uses: actions/download-artifact@v4
      with:
        name: python-sdk.tar.gz
        path: ${{ github.workspace }}/sdk/
    - name: Uncompress python SDK
      run: mkdir -p ${{ github.workspace }}/sdk/python && tar -zxf ${{ github.workspace }}/sdk/python.tar.gz -C
        ${{ github.workspace }}/sdk/python
      shell: bash
    - name: Assert PyPI trusted publishing prerequisites
      if: ${{ inputs.pypiTrustedPublishing == 'true' }}
      run: |
        set -euo pipefail

        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "PyPI trusted publishing requires GitHub Actions OIDC. Set 'id-token: write' on this job."
          exit 1
        fi

        if [[ -n "${PYPI_PASSWORD:-}" ]]; then
          echo "pypiTrustedPublishing is enabled, but PYPI_PASSWORD is set. Remove PYPI_PASSWORD to publish with OIDC."
          exit 1
        fi
      shell: bash
    # Trusted publishing is done by hand rather than with pypa/gh-action-pypi-publish:
    # nested inside this composite action, that action resolves its Docker image
    # from the outer action's github.action_repository/action_ref and fails to pull
    # (actions/runner#2473, pypa/gh-action-pypi-publish#299).
    - name: Install Twine
      run: python -m pip install pip twine
      shell: bash
    - name: Publish Python SDK (trusted publishing)
      if: ${{ inputs.pypiTrustedPublishing == 'true' }}
      working-directory: ${{ github.workspace }}/sdk/python/bin/dist
      run: |
        set -euo pipefail
        shopt -s nullglob
        dists=(*.whl *.tar.gz)
        if [[ ${#dists[@]} -eq 0 ]]; then
          echo "No Python distributions found in $PWD"
          exit 1
        fi

        json() { python -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]])" "$1"; }

        # Exchange a GitHub Actions OIDC token for a short-lived PyPI API token.
        audience=$(curl -fsS https://pypi.org/_/oidc/audience | json audience)
        oidc=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | json value)
        echo "::add-mask::${oidc}"
        token=$(python -c "import json,sys; print(json.dumps({'token': sys.argv[1]}))" "${oidc}" \
          | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" --data-binary @- \
            https://pypi.org/_/oidc/mint-token | json token)
        echo "::add-mask::${token}"

        # No PEP 740 attestations: PyPI verifies them against the Trusted Publisher
        # that minted the token, by the certificate's Build Config URI. GitHub sets
        # that to the *top-level* workflow, while the token exchange matches
        # job_workflow_ref, so when this runs inside a reusable workflow (as
        # pulumi providers' publish.yml is) no publisher can satisfy both.
        echo "Publishing Pip package to pypi with trusted publishing:"
        python -m twine upload -u __token__ -p "${token}" \
          --skip-existing --verbose "${dists[@]}"
      shell: bash
    - name: Publish Python SDK
      if: ${{ inputs.pypiTrustedPublishing != 'true' }}
      run: if [ -n "${PYPI_USERNAME}" ] ;
        then PYPI_PUBLISH_USERNAME=${PYPI_USERNAME};
        else PYPI_PUBLISH_USERNAME="pulumi";
        fi &&
        echo "Publishing Pip package to pypi as ${PYPI_PUBLISH_USERNAME}:" &&
        twine upload
        -u "${PYPI_PUBLISH_USERNAME}" -p "${PYPI_PASSWORD}"
        "${{ github.workspace }}/sdk/python/bin/dist/*"
        --skip-existing
        --verbose
      shell: bash
